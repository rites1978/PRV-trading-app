<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PRV Autonomous AI Trading Floor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0b0f19; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 25px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { color: #38bdf8; font-size: 24px; margin: 0; }
        
        /* KPI Grid */
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .card { background: #111827; border: 1px solid #1f2937; padding: 20px; border-radius: 12px; }
        h2 { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 8px; }
        .value-large { font-size: 26px; font-weight: bold; color: #f3f4f6; }
        .pos { color: #34d399; font-weight: bold; }
        .neg { color: #f87171; font-weight: bold; }

        /* Main Growth Curve Card */
        .main-card { background: #111827; border: 1px solid #1f2937; padding: 25px; border-radius: 12px; margin-bottom: 25px; }
        .main-card h2 { margin-bottom: 15px; }

        /* Tabs styling */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #1f2937; padding-bottom: 10px; }
        .tab-btn { background: #1f2937; color: #94a3b8; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .tab-btn.active { background: #38bdf8; color: #0b0f19; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tables & Logs */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #1f2937; }
        th { color: #6b7280; font-weight: 500; }
        .log-box { background: #030712; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 300px; overflow-y: auto; border: 1px solid #374151; }
        .log-entry { margin-bottom: 6px; }
        .log-time { color: #6b7280; margin-right: 8px; }
        .log-success { color: #34d399; font-weight: bold; }
        .log-error { color: #f87171; font-weight: bold; }
        .log-warning { color: #facc15; font-weight: bold; }
        .log-info { color: #94a3b8; }

        .btn { background: #38bdf8; color: #0b0f19; font-weight: bold; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #0ea5e9; }
        .market-status { display: flex; gap: 15px; padding: 6px 12px; background: #1f2937; border-radius: 6px; border: 1px solid #374151;}
        .market-indicator { font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <h1>PRV Autonomous AI Trading Floor</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="market-status">
                <div class="market-indicator" id="ukStatus"><span class="dot" style="background: #6b7280;"></span> UK: LSE</div>
                <div class="market-indicator" id="usStatus"><span class="dot" style="background: #6b7280;"></span> US: NYSE</div>
            </div>
            <button class="btn" onclick="triggerTrade()">Force Trade</button>
        </div>
    </div>

    <!-- Top 4 KPI Cards -->
    <div class="grid">
        <div class="card">
            <h2>Total Equity</h2>
            <div class="value-large" id="totalEquity">£--.--</div>
        </div>
        <div class="card">
            <h2>Available Cash</h2>
            <div class="value-large" id="cashBal" style="color: #38bdf8;">£--.--</div>
        </div>
        <div class="card">
            <h2>Banked Profits</h2>
            <div class="value-large" id="bankedProfits" style="color: #34d399;">£0.00</div>
        </div>
        <div class="card">
            <h2>Rate of Return</h2>
            <div class="value-large" id="rateOfReturn">0.00%</div>
        </div>
    </div>

    <!-- Main Portfolio Growth Curve -->
    <div class="main-card">
        <h2>Portfolio Growth Curve</h2>
        <div style="height: 320px; position: relative;">
            <canvas id="growthChart"></canvas>
        </div>
    </div>

    <!-- Tabbed Section for Logs & Holdings -->
    <div class="main-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'holdingsTab')">Live Active Holdings</button>
            <button class="tab-btn" onclick="switchTab(event, 'logsTab')">AI Execution Logs</button>
        </div>

        <!-- Tab 1: Holdings -->
        <div id="holdingsTab" class="tab-content active">
            <table>
                <thead>
                    <tr>
                        <th>Instrument</th>
                        <th>Shares</th>
                        <th>Avg Buy Price</th>
                        <th>Current Price</th>
                        <th>Return (P/L)</th>
                    </tr>
                </thead>
                <tbody id="portfolioTable">
                    <tr><td colspan="5" style="text-align: center; color: #6b7280; padding: 25px;">Scanning global markets...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Tab 2: Logs -->
        <div id="logsTab" class="tab-content">
            <div class="log-box" id="logStream">Connecting to AI core...</div>
        </div>
    </div>

    <script>
        // Tab switching logic
        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        // Initialize Growth Chart
        const ctx = document.getElementById('growthChart').getContext('2d');
        const growthChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Total Equity (£)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.08)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.35,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { ticks: { color: '#6b7280', font: { size: 11 } }, grid: { color: '#1f2937' } },
                    y: { ticks: { color: '#6b7280', font: { size: 11 } }, grid: { color: '#1f2937' } }
                }
            }
        });

        async function triggerTrade() {
            try { await fetch('/api/trigger-trade'); updateDashboard(); } catch(e) {}
        }

        async function updateDashboard() {
            try {
                const res = await fetch('/api/dashboard_data');
                const data = await res.json();
                
                document.getElementById('totalEquity').innerText = '£' + data.total_equity.toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('cashBal').innerText = '£' + data.cash_balance.toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                document.getElementById('bankedProfits').innerText = '£' + (data.banked_profits || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                
                const baseCapital = 50000.00;
                const ror = ((data.total_equity - baseCapital) / baseCapital) * 100;
                const rorElem = document.getElementById('rateOfReturn');
                rorElem.innerText = (ror >= 0 ? '+' : '') + ror.toFixed(2) + '%';
                rorElem.className = 'value-large ' + (ror >= 0 ? 'pos' : 'neg');
                
                const ukOpen = data.markets.UK;
                const usOpen = data.markets.US;
                document.getElementById('ukStatus').innerHTML = `<span class="dot" style="background: ${ukOpen ? '#34d399' : '#f87171'};"></span> UK: ${ukOpen ? 'OPEN' : 'CLOSED'}`;
                document.getElementById('usStatus').innerHTML = `<span class="dot" style="background: ${usOpen ? '#34d399' : '#f87171'};"></span> US: ${usOpen ? 'OPEN' : 'CLOSED'}`;

                const timeNow = new Date().toLocaleTimeString();
                if (growthChart.data.labels.length > 30) {
                    growthChart.data.labels.shift();
                    growthChart.data.datasets[0].data.shift();
                }
                growthChart.data.labels.push(timeNow);
                growthChart.data.datasets[0].data.push(data.total_equity);
                growthChart.update();

                const logHtml = data.system_logs.map(log => {
                    let colorClass = log.level === 'success' ? 'log-success' : (log.level === 'error' ? 'log-error' : (log.level === 'warning' ? 'log-warning' : 'log-info'));
                    return `<div class="log-entry"><span class="log-time">[${log.time}]</span><span class="${colorClass}">${log.msg}</span></div>`;
                }).join('');
                document.getElementById('logStream').innerHTML = logHtml;

                const tbody = document.getElementById('portfolioTable');
                if (data.portfolio && data.portfolio.length > 0) {
                    tbody.innerHTML = data.portfolio.map(pos => {
                        const avg = parseFloat(pos.averagePrice);
                        const cur = parseFloat(pos.currentPrice);
                        const retPct = ((cur - avg) / avg) * 100;
                        const retClass = retPct >= 0 ? 'pos' : 'neg';
                        const retSign = retPct >= 0 ? '+' : '';
                        const cleanTicker = pos.ticker.replace('l_EQ', '').replace('_US_EQ', '');
                        
                        return `
                        <tr>
                            <td style="font-weight: bold;">${cleanTicker}</td>
                            <td>${pos.quantity}</td>
                            <td>${pos.averagePrice.toFixed(4)}</td>
                            <td>${pos.currentPrice.toFixed(4)}</td>
                            <td class="${retClass}">${retSign}${retPct.toFixed(3)}%</td>
                        </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #6b7280; padding: 25px;">No active positions. AI scanning markets...</td></tr>';
                }
            } catch(e) {}
        }
        
        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
